name: Deploy Oopz

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/local-checkpoint-20260403

concurrency:
  group: deploy-oopz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        run: go test ./...

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o release/oopz-live-linux-amd64 ./cmd/server

      - name: Prepare remote directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            mkdir -p "${{ secrets.SERVER_DEPLOY_PATH }}/release"
            mkdir -p "${{ secrets.SERVER_DEPLOY_PATH }}/frontend"
            mkdir -p "${{ secrets.SERVER_DEPLOY_PATH }}/_incoming/${{ github.sha }}"

      - name: Upload backend binary and frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: "release/oopz-live-linux-amd64,frontend/dist"
          target: ${{ secrets.SERVER_DEPLOY_PATH }}/_incoming/${{ github.sha }}
          overwrite: true
          strip_components: 0

      - name: Ensure headless Chrome for media resolver
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            set -e
            # /api/media/resolve 用无头 chrome 嗅探视频直链。装完整 chrome-for-testing
            # （从 npmmirror 国内 CDN 下，非 snap、含专有编解码），软链到 google-chrome
            # 让 chromedp 默认就能找到；系统运行库走服务器已配置的国内 apt 镜像。
            CHROME_DIR=/opt/oopz-chrome
            CHROME_BIN="$CHROME_DIR/chrome-linux64/chrome"
            CHROME_VER=130.0.6723.116
            if [ -x "$CHROME_BIN" ]; then
              echo "chrome already present: $CHROME_BIN"
            else
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y || true
                sudo apt-get install -y --no-install-recommends \
                  ca-certificates unzip fonts-liberation \
                  libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
                  libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
                  libgbm1 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0 libxshmfence1 || true
              fi
              sudo mkdir -p "$CHROME_DIR"
              TMP=$(mktemp -d)
              curl -fsSL -o "$TMP/chrome.zip" \
                "https://cdn.npmmirror.com/binaries/chrome-for-testing/${CHROME_VER}/linux64/chrome-linux64.zip"
              sudo unzip -oq "$TMP/chrome.zip" -d "$CHROME_DIR"
              sudo chmod +x "$CHROME_BIN"
              rm -rf "$TMP"
            fi
            sudo ln -sf "$CHROME_BIN" /usr/local/bin/google-chrome
            google-chrome --version || true

      - name: Promote artifacts and restart oopz-live service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            INCOMING="${{ secrets.SERVER_DEPLOY_PATH }}/_incoming/${{ github.sha }}"
            LIVE="${{ secrets.SERVER_DEPLOY_PATH }}"
            sudo systemctl stop oopz-live || true
            mkdir -p "$LIVE/release" "$LIVE/frontend"
            cp "$INCOMING/release/oopz-live-linux-amd64" "$LIVE/release/oopz-live-linux-amd64"
            rm -rf "$LIVE/frontend/dist"
            cp -R "$INCOMING/frontend/dist" "$LIVE/frontend/dist"
            chmod +x "$LIVE/release/oopz-live-linux-amd64"
            sudo systemctl restart oopz-live
            sudo systemctl status oopz-live --no-pager
            curl -fsS http://127.0.0.1:18080/healthz
            rm -rf "$INCOMING"
